services:
  postgres:
    image: postgres:15
    container_name: listion-postgres-prod-simple
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listion}
      POSTGRES_USER: ${POSTGRES_USER:-listion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - listion-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-listion_user} -d ${POSTGRES_DB:-listion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: listion-backend-prod-simple
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-listion_user}
      DB_PASS: ${POSTGRES_PASSWORD:-changeme}
      DB_NAME: ${POSTGRES_DB:-listion}
      JWT_SECRET: ${JWT_SECRET:-supersecret_change_in_production}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - listion-network-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: listion-frontend-prod-simple
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - listion-network-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  listion-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
